[project]
name = "gst-copilot"
version = "0.1.0"
description = "AI-powered GST filing assistant for small businesses"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "supabase==2.5.0",
    "pymupdf>=1.24.0",
    "pillow>=10.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "langfuse>=2.36.0",
    "prometheus-client>=0.20.0",
    "evidently>=0.4.30",
    "pytest>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "ui", "db", "evals"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
